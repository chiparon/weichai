services:
  seekdb:
    # Pinned: SeekDB upgrades may change on-disk format. Bump deliberately,
    # after `npm run data:backup`, never by pulling a moving tag.
    image: oceanbase/seekdb:1.3.0.0-100000092026051510@sha256:e3a46b6520fa6b6fb7949d03b8c6f22cef180e6c84953b839ad56a358d34932d
    container_name: forexplore-seekdb
    ports:
      - "127.0.0.1:2881:2881"
      - "127.0.0.1:2886:2886"
    environment:
      SEEKDB_DATABASE: forexplore
      MEMORY_LIMIT: 2G
      LOG_DISK_SIZE: 8G
      CPU_COUNT: 2
    volumes:
      - seekdb-data:/var/lib/oceanbase
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 2881 -u root"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  seekdb-data:
